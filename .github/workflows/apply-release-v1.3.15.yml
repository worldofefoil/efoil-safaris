name: Apply release 1.3.15

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-release-v1.3.15.yml

permissions:
  contents: write

concurrency:
  group: apply-release-v1-3-15
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out theme
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch, commit, and release
        id: release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -o pipefail
          {
            set -euxo pipefail

            current_version=$(sed -n 's/^Version:[[:space:]]*//p' style.css | head -n 1 | tr -d '\r')
            if [ "$current_version" = "1.3.15" ]; then
              echo "Release 1.3.15 is already applied."
              exit 0
            fi

            test -f tools/release-v1.3.15.patch

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git rm -f assets/fonts/inter-400.ttf assets/fonts/inter-600.ttf assets/fonts/inter-700.ttf
            git apply --check --whitespace=nowarn tools/release-v1.3.15.patch
            git apply --whitespace=nowarn tools/release-v1.3.15.patch
            git rm -f tools/release-v1.3.15.patch
            rmdir tools 2>/dev/null || true

            new_version=$(sed -n 's/^Version:[[:space:]]*//p' style.css | head -n 1 | tr -d '\r')
            test "$new_version" = "1.3.15"

            git status --short
            git add -A
            git commit -m "Release 1.3.15 booking confidence and legal polish"
            git push origin HEAD:main

            new_sha=$(git rev-parse HEAD)
            if gh release view v1.3.15 >/dev/null 2>&1; then
              gh release edit v1.3.15 --target "$new_sha" --title "Efoil Safaris 1.3.15" --notes "WordPress theme release 1.3.15."
            else
              gh release create v1.3.15 --target "$new_sha" --title "Efoil Safaris 1.3.15" --notes "WordPress theme release 1.3.15."
            fi
          } 2>&1 | tee release-v1.3.15-debug.log

      - name: Upload debug log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-v1.3.15-debug
          path: release-v1.3.15-debug.log

      - name: Fail on release error
        if: steps.release.outcome != 'success'
        shell: bash
        run: exit 1
